<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasboek</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
    h1 { color: #333; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    ul { list-style-type: none; padding: 0; }
    li { background: #eee; margin: 5px 0; padding: 10px; border-radius: 4px; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Kasboek</h1>
    <div id="auth-section">
      <input type="password" id="password" placeholder="Voer wachtwoord in">
      <button onclick="checkPassword()">Inloggen</button>
    </div>
    <div id="app-section" style="display:none;">
      <input type="text" id="desc" placeholder="Omschrijving">
      <input type="number" id="amount" placeholder="Bedrag (€)">
      <button onclick="addTransaction()">Toevoegen</button>
      <h3>Transacties</h3>
      <ul id="transaction-list"></ul>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBw-A3I8f8A0mC7J5K0",
      authDomain: "kasboek-c0500.firebaseapp.com",
      databaseURL: "https://kasboek-c0500-default-rtdb.firebaseio.com",
      projectId: "kasboek-c0500",
      storageBucket: "kasboek-c0500.appspot.com",
      messagingSenderId: "129184310893",
      appId: "1:129184310893:web:5d2a9316d2fa5bb4d1ad"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    async function checkPassword() {
      const input = document.getElementById('password').value;
      const buffer = new TextEncoder().encode(input);
      const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

      if (hashHex === "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8") {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('app-section').style.display = 'block';
        loadTransactions();
      } else {
        alert("Onjuist wachtwoord!");
      }
    }

    function addTransaction() {
      const desc = document.getElementById('desc').value;
      const amount = document.getElementById('amount').value;
      if (desc && amount) {
        database.ref('transactions').push({
          desc: desc,
          amount: amount,
          date: new Date().toISOString()
        });
        document.getElementById('desc').value = '';
        document.getElementById('amount').value = '';
      }
    }

    function loadTransactions() {
      database.ref('transactions').on('value', (snapshot) => {
        const list = document.getElementById('transaction-list');
        list.innerHTML = '';
        const data = snapshot.val();
        for (let id in data) {
          const item = data[id];
          const li = document.createElement('li');
          li.textContent = `${item.desc}: €${item.amount}`;
          list.appendChild(li);
        }
      });
    }
  </script>
</body>
</html>
